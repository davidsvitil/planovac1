<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denní plánovač</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f5f4;--sf:#fff;--tx:#14211f;--mu:#5d6b68;--ln:#d5dcda;--ac:#0e6b5c;--wa:#c2410c;--wb:#fde8dc;--ok:#9aa9a5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--sf:#18241f;--tx:#e6efec;--mu:#8fa09b;--ln:#2a3a35;--ac:#3dbfa6;--wa:#ff9a62;--wb:#3a2418;--ok:#566761}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.6rem;margin:4px 0 0;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 16px}
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{background:var(--wb);color:var(--tx);border-left:4px solid var(--wa);padding:10px 12px;border-radius:6px;font-size:.95rem}
.alert b{color:var(--wa)}
.alert.calm{background:var(--sf);border-left-color:var(--ac)}
.alert.calm b{color:var(--ac)}
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar input,.bar button,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px}
.bar input[type=text]{flex:1;min-width:0}
button{cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--ln);position:relative}
.tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mu);padding-top:2px}
.tt{display:flex;gap:10px;align-items:start}
.tt input{margin-top:5px;width:18px;height:18px;accent-color:var(--ac)}
.done .tx{text-decoration:line-through;color:var(--ok)}
.late .tm{color:var(--wa)}
.x{border:none;background:none;color:var(--mu);padding:2px 8px;font-size:1.2rem}
.now{display:flex;align-items:center;gap:8px;color:var(--wa);font-weight:700;font-size:.85rem;padding:2px 0}
.now::after{content:"";flex:1;height:2px;background:var(--wa)}
.empty{color:var(--mu);padding:16px 0;border-top:1px solid var(--ln)}
.foot{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:.85rem;align-items:center}
</style>
</head>
<body>
<main>
<h1 id="dt">Dnes</h1>
<p class="sub" id="cl"></p>
<div class="alerts" id="al"></div>
<div class="bar">
<input type="time" id="ti" value="18:00" aria-label="Čas">
<input type="text" id="tx" placeholder="Co tě dnes čeká?" aria-label="Úkol">
<button class="pri" id="add">Přidat</button>
</div>
<ul class="tl" id="ls"></ul>
<div class="bar">
<input type="text" id="tp" placeholder="Název ntfy tématu (zůstane jen v tomto zařízení)" aria-label="Téma ntfy" autocomplete="off">
<button id="tps">Uložit</button>
<button id="tpt">Test</button>
</div>
<p class="sub" id="st"></p>
<div class="foot">
<button id="rep">Přidat denní rutinu</button>
<button id="nt">Zapnout upozornění v prohlížeči</button>
<span>Upozornění fungují, jen když je stránka otevřená.</span>
</div>
</main>
<script>
(function(){
var KEY="planovac-v1",today=new Date().toISOString().slice(0,10);
var S={day:today,tasks:[],routine:[]};
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}}catch(e){}
 if(!S.routine)S.routine=[];
 if(S.day!==today){S.tasks=S.routine.map(mk);S.day=today;save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mk(r){return{id:Math.random().toString(36).slice(2),t:r.t,x:r.x,d:false}}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function nowM(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(i){return document.getElementById(i)};
var fired={};
function topic(){try{return localStorage.getItem("planovac-topic")||""}catch(e){return ""}}
function send(msg,at){var tp=topic();if(!tp)return false;
 var u="https://ntfy.sh/"+encodeURIComponent(tp)+"/publish?title="+encodeURIComponent("Plánovač")+"&message="+encodeURIComponent(msg)+(at?"&delay="+at:"");
 try{fetch(u,{mode:"no-cors"});return true}catch(e){return false}}
function schedule(t){if(!topic()||t.s)return;
 var now=Math.floor(Date.now()/1000),d=new Date();d.setHours(0,0,0,0);
 var due=Math.floor(d.getTime()/1000)+mins(t.t)*60;
 if(due<=now)return;
 var at=Math.max(now+15,due-900);
 if(send((at<due?"Za 15 min: ":"Teď: ")+t.x,at)){t.s=1;save()}}
function scheduleAll(){S.tasks.forEach(schedule)}
function notify(k,msg){if(fired[k])return;fired[k]=1;
 try{if(window.Notification&&Notification.permission==="granted")new Notification("Plánovač",{body:msg})}catch(e){}}
function alerts(){
 var n=nowM(),out=[],open=S.tasks.filter(function(t){return!t.d}).sort(function(a,b){return mins(a.t)-mins(b.t)});
 var late=open.filter(function(t){return mins(t.t)<n-15});
 var soon=open.filter(function(t){var d=mins(t.t)-n;return d>=0&&d<=30});
 var wd=new Date().getDay();
 soon.forEach(function(t){var d=mins(t.t)-n;var m="Za "+d+" min: "+t.x;out.push(["Blíží se",m]);notify("s"+t.id,m)});
 late.forEach(function(t){var m="Zmeškané od "+t.t+": "+t.x;out.push(["Zmeškáno",m]);notify("l"+t.id,m)});
 if(!S.tasks.length&&n>=6*60+30&&n<20*60)out.push(["Prázdný den","Nemáš nic naplánováno. Přidej aspoň tři věci."]);
 if(S.tasks.length>8)out.push(["Moc úkolů","Máš jich "+S.tasks.length+". Co z toho opravdu musí být dnes?"]);
 if(n>=20*60&&open.length)out.push(["Večerní přehled",open.length+" nedokončeno. Přesuň je, nebo škrtni."]);
 if(wd===0&&n>=18*60)out.push(["Neděle večer","Naplánuj týden: škola, trénink, praxe."]);
 if(wd===5&&n>=15*60)out.push(["Pátek","Zkontroluj víkendový plán a zázemí na jízdu."]);
 var h=$("al");h.innerHTML="";
 if(!out.length&&S.tasks.length){h.innerHTML='<div class="alert calm"><b>V klidu</b> – nic nehoří.</div>'}
 out.forEach(function(o){h.insertAdjacentHTML("beforeend",'<div class="alert"><b>'+o[0]+':</b> '+esc(o[1])+'</div>')});
}
function render(){
 var n=nowM(),L=$("ls"),T=S.tasks.slice().sort(function(a,b){return mins(a.t)-mins(b.t)}),h="",placed=false;
 T.forEach(function(t){
  if(!placed&&mins(t.t)>n){h+='<li style="display:block;border:0;padding:0"><div class="now">Teď '+pad(Math.floor(n/60))+":"+pad(n%60)+"</div></li>";placed=true}
  var late=!t.d&&mins(t.t)<n-15;
  h+='<li class="'+(t.d?"done ":"")+(late?"late":"")+'"><span class="tm">'+t.t+'</span><label class="tt"><input type="checkbox" data-c="'+t.id+'"'+(t.d?" checked":"")+'><span class="tx">'+esc(t.x)+'</span></label><button class="x" data-x="'+t.id+'" aria-label="Smazat">×</button></li>'});
 if(!placed&&T.length)h+='<li style="display:block;border:0;padding:0"><div class="now">Teď '+pad(Math.floor(n/60))+":"+pad(n%60)+"</div></li>";
 if(!T.length)h='<li class="empty" style="display:block">Zatím nic. Přidej první úkol nahoře.</li>';
 L.innerHTML=h;alerts()}
function pad(x){return(x<10?"0":"")+x}
$("add").onclick=function(){var x=$("tx").value.trim();if(!x)return;var nt={id:Math.random().toString(36).slice(2),t:$("ti").value||"12:00",x:x,d:false};S.tasks.push(nt);schedule(nt);$("tx").value="";save();render()};
$("tx").onkeydown=function(e){if(e.key==="Enter")$("add").onclick()};
$("ls").onclick=function(e){var c=e.target.getAttribute("data-c"),x=e.target.getAttribute("data-x");
 if(c){S.tasks.forEach(function(t){if(t.id===c)t.d=e.target.checked})}
 if(x){S.tasks=S.tasks.filter(function(t){return t.id!==x})}
 if(c||x){save();render()}};
$("rep").onclick=function(){var x=$("tx").value.trim();if(!x){$("tx").focus();$("tx").placeholder="Napiš rutinu a znovu klikni";return}
 S.routine.push({t:$("ti").value||"12:00",x:x});var rt=mk({t:$("ti").value||"12:00",x:x});S.tasks.push(rt);schedule(rt);$("tx").value="";save();render()};
$("nt").onclick=function(){try{Notification.requestPermission().then(function(p){$("nt").textContent=p==="granted"?"Upozornění zapnuta":"Upozornění zablokována"})}catch(e){$("nt").textContent="Prohlížeč to nepodporuje"}};
var d=new Date();$("dt").textContent=d.toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"});
function st(){$("st").textContent=topic()?"ntfy: téma uloženo. Upozornění chodí 15 min před úkolem i při zavřené appce.":"ntfy: téma není nastaveno, upozornění na telefon nepůjdou."}
$("tp").value=topic();
$("tps").onclick=function(){var v=$("tp").value.trim();try{localStorage.setItem("planovac-topic",v)}catch(e){}st();scheduleAll();save();render()};
$("tpt").onclick=function(){$("st").textContent=send("Test z plánovače",0)?"Test odeslán, mrkni na iPhone.":"Nejdřív ulož téma."};
load();st();scheduleAll();render();setInterval(render,60000);
})();
</script>
</body>
</html>
